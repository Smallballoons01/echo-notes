name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # The lockfile is committed and pinned, so a frozen install proves the
      # manifest and the lockfile still agree. The Harness packages this plugin
      # develops against are on npm but NOT under the `latest` tag (npm's
      # `latest` for @deepseek-ai/dsh-tools is still the placeholder
      # 0.0.1-rc.1); devDependencies pins the exact versions.
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 语法检查
        run: pnpm check

      - name: 单元与集成测试
        run: pnpm test

      # Some layers of the suite skip themselves when the Harness packages do
      # not resolve. A silent skip is the failure mode this guards: it lets a
      # green run prove nothing. The packages are pinned in devDependencies, so
      # on CI there is no legitimate reason for a test to skip.
      - name: 断言没有测试被静默跳过
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee /tmp/tap.txt
          if grep -qE '^# skipped [1-9]' /tmp/tap.txt; then
            echo "::error::some tests skipped — the harness packages did not resolve"
            exit 1
          fi
