name: Bug report
description: Report a reproducible Echo Notes defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include diary contents, passphrases, API payload secrets, or private screenshots."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior without including private note text.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: harness-version
    attributes:
      label: DeepSeek Harness version
  - type: input
    id: node-version
    attributes:
      label: Node.js version
